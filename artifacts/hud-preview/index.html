<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showdown Tactician HUD - Mobile & Desktop</title>
  <style>
    :root { color-scheme: dark; --paper: #292b2c; --signal: #c8c6bd; --ink: #ecebe7; --rule: #5b5d5c; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px;
      background: #242626;
      color: var(--ink); font: 15px/1.5 Arial, Helvetica, sans-serif;
    }
    main { width: min(1500px, 100%); margin: 0 auto; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 0 0 24px; }
    .kicker { margin: 0 0 6px; color: #c0c0bb; font-size: 11px; font-weight: 600; letter-spacing: .06em; }
    h1 { margin: 0; font: 500 clamp(28px, 4vw, 48px)/1.05 Georgia, serif; letter-spacing: -.025em; }
    .intro { max-width: 400px; margin: 0; color: #b7b5ae; }
    .gallery { display: grid; grid-template-columns: minmax(260px, 412fr) minmax(0, 1440fr); align-items: start; gap: 20px; }
    figure { min-width: 0; margin: 0; overflow: hidden; background: var(--paper); border: 1px solid var(--rule); }
    figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: #303233; border-bottom: 1px solid var(--rule); }
    figcaption strong { font-size: 13px; font-weight: 600; }
    figcaption span { color: #bcbab3; font: 11px ui-monospace, monospace; }
    figure img { display: block; width: 100%; height: auto; background: var(--paper); }
    .mobile img { max-width: 412px; margin: 0 auto; }
    .note { margin: 12px 0 0; color: #a7a59e; font-size: 12px; }
    @media (max-width: 760px) {
      body { padding: 18px; }
      header { display: block; }
      .intro { margin-top: 12px; }
      .gallery { grid-template-columns: 1fr; }
      .mobile img { width: min(100%, 412px); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="kicker">Showdown Tactician</p><h1>Battle readout.</h1></div>
      <p class="intro">A quieter companion to the battle screen, with the next play and opponent notes close at hand.</p>
    </header>
    <section class="gallery" aria-label="Mobile and desktop HUD screenshots">
      <figure class="mobile">
        <figcaption><strong>Mobile / readout open</strong><span>412 × 915</span></figcaption>
        <img src="mobile-field-atlas.png" alt="Mobile Pokémon Showdown battle with the expanded match readout" />
      </figure>
      <figure class="desktop">
        <figcaption><strong>Desktop / side console</strong><span>1440 × 900</span></figcaption>
        <img src="desktop-field-atlas.png" alt="Desktop Pokémon Showdown battle with the expanded match readout" />
      </figure>
    </section>
    <p class="note">Captured from the extension in Chromium using the battle fixture. The readout shown here is expanded; it stays collapsed by default in play.</p>
  </main>
</body>
</html>
